<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- ARTIFACT:HEAD -->
<title>Half-Term Recall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* ---------- tokens ---------- */
:root{
  color-scheme: light;
  --paper:#EFF3F2; --surface:#FFFFFF; --surface-2:#E6EDEB; --surface-3:#DCE6E4;
  --ink:#0D1A1B; --ink-2:#3C4F50; --ink-3:#6B807F;
  --line:#D2DEDC; --line-2:#BECECB;
  --accent:#0B6B6B; --accent-2:#085252; --accent-soft:#D7ECEA; --on-accent:#FFFFFF;
  --mark:#F0BE28; --mark-soft:#FBEEC2;
  --strong:#1C7A54; --fading:#A9700F; --weak:#AF3A31;
  --strong-soft:#D8EEE2; --fading-soft:#F8E8C9; --weak-soft:#F6DEDB;
  --shadow-1:0 1px 2px rgba(13,26,27,.06);
  --shadow-2:0 2px 4px rgba(13,26,27,.05), 0 14px 34px -18px rgba(13,26,27,.45);
  --r-s:6px; --r-m:10px; --r-l:16px;
  --sans:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --display:"Bricolage Grotesque", "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#080F10; --surface:#111C1D; --surface-2:#172426; --surface-3:#1E2E30;
    --ink:#E6EEEC; --ink-2:#AEC2C0; --ink-3:#7C9391;
    --line:#223234; --line-2:#2E4143;
    --accent:#3EB3AA; --accent-2:#6AD2C8; --accent-soft:#0F2E2D; --on-accent:#04191A;
    --mark:#EFC552; --mark-soft:#3A2F0E;
    --strong:#4EC08C; --fading:#DFA33D; --weak:#E2695F;
    --strong-soft:#102C22; --fading-soft:#2F2410; --weak-soft:#2F1714;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 2px 4px rgba(0,0,0,.3), 0 14px 34px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#080F10; --surface:#111C1D; --surface-2:#172426; --surface-3:#1E2E30;
  --ink:#E6EEEC; --ink-2:#AEC2C0; --ink-3:#7C9391;
  --line:#223234; --line-2:#2E4143;
  --accent:#3EB3AA; --accent-2:#6AD2C8; --accent-soft:#0F2E2D; --on-accent:#04191A;
  --mark:#EFC552; --mark-soft:#3A2F0E;
  --strong:#4EC08C; --fading:#DFA33D; --weak:#E2695F;
  --strong-soft:#102C22; --fading-soft:#2F2410; --weak-soft:#2F1714;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 2px 4px rgba(0,0,0,.3), 0 14px 34px -18px rgba(0,0,0,.9);
}

/* ---------- reset ---------- */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.5;
  -webkit-text-size-adjust:100%;
}
img{max-width:100%}
[hidden]{display:none !important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:3px}
h1,h2,h3,h4{font-family:var(--display);font-weight:800;margin:0;text-wrap:balance;letter-spacing:-.015em}
p{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500}

/* ---------- app shell ---------- */
.shell{min-height:100vh;display:grid;grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
.topbar{
  display:flex;align-items:center;gap:12px;
  padding-block:10px; padding-inline:16px;
  background:var(--surface);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:20;
}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto;min-width:0}
.brand-mark{
  width:30px;height:30px;border-radius:9px;flex:none;
  background:var(--accent);color:var(--on-accent);
  display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:13px;
}
.brand-name{font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:11px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;display:block;line-height:1.2}
.duepill{
  display:inline-flex;align-items:center;gap:7px;border-radius:999px;
  padding:5px 12px 5px 9px;border:1px solid var(--line-2);background:var(--surface-2);
  font-size:13px;font-weight:500;white-space:nowrap;
}
.duepill.hot{background:var(--mark-soft);border-color:var(--mark)}
.duepill .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.duepill.hot .dot{background:var(--mark);box-shadow:0 0 0 0 rgba(240,190,40,.7);animation:pulse 2.4s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(240,190,40,0)}100%{box-shadow:0 0 0 0 rgba(240,190,40,0)}}
.iconbtn{
  width:34px;height:34px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface);display:grid;place-items:center;font-size:15px;flex:none;
}
.iconbtn:hover{background:var(--surface-2)}

.body{display:grid;grid-template-columns:1fr;min-width:0}
.rail{display:none}
main{padding-inline:16px;padding-block:20px 96px;min-width:0}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:20;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--surface);border-top:1px solid var(--line);
  padding-block:6px 8px;padding-inline:4px;
}
.tabbar a{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  text-decoration:none;color:var(--ink-3);font-size:10.5px;font-weight:500;
  letter-spacing:.02em;padding:4px 2px;border-radius:8px;
}
.tabbar a .ic{font-size:17px;line-height:1}
.tabbar a[aria-current="page"]{color:var(--accent)}

@media (min-width:900px){
  .body{grid-template-columns:212px 1fr}
  .rail{
    display:flex;flex-direction:column;gap:2px;
    padding:18px 12px;border-right:1px solid var(--line);background:var(--surface);
    position:sticky;top:51px;align-self:start;height:calc(100vh - 51px);
  }
  .rail a{
    display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink-2);
    padding:9px 11px;border-radius:9px;font-size:14.5px;font-weight:500;
  }
  .rail a .ic{font-size:16px;width:20px;text-align:center}
  .rail a:hover{background:var(--surface-2);color:var(--ink)}
  .rail a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .rail-foot{margin-top:auto;font-size:11.5px;color:var(--ink-3);line-height:1.45;padding:11px}
  .tabbar{display:none}
  main{padding-block:28px 60px;padding-inline:28px}
}

/* ---------- generic pieces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--shadow-1)}
.pad{padding:18px}
.sec-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sec-head h2{font-size:19px}
.sec-head .note{font-size:13px;color:var(--ink-3);margin-left:auto}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600;font-family:var(--sans)}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border-radius:var(--r-m);border:1px solid var(--line-2);background:var(--surface);
  color:var(--ink);padding:10px 15px;font-size:14.5px;font-weight:600;
  text-decoration:none;transition:background .12s ease, border-color .12s ease, transform .06s ease;
}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.wide{width:100%}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--weak);border-color:var(--line-2)}
.btn.danger:hover{background:var(--weak-soft)}
.btn[disabled]{opacity:.45;pointer-events:none}

.chip{
  display:inline-flex;align-items:center;gap:6px;border-radius:999px;
  padding:3px 10px;font-size:12px;font-weight:600;
  background:var(--surface-2);color:var(--ink-2);border:1px solid transparent;white-space:nowrap;
}
.chip.a{background:var(--accent-soft);color:var(--accent)}
.chip.b{background:var(--mark-soft);color:var(--fading)}
.chip.strong{background:var(--strong-soft);color:var(--strong)}
.chip.fading{background:var(--fading-soft);color:var(--fading)}
.chip.weak{background:var(--weak-soft);color:var(--weak)}
.chip.outline{background:transparent;border-color:var(--line-2);color:var(--ink-3);font-weight:500}

label.field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink-2);min-width:0}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{
  width:100%;padding:9px 11px;border-radius:var(--r-m);border:1px solid var(--line-2);
  background:var(--surface);font-size:15px;font-weight:400;
}
textarea{resize:vertical;line-height:1.55;font-family:var(--sans)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}

.bar{height:7px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar > span{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .4s ease}
.bar.strong > span{background:var(--strong)} .bar.fading > span{background:var(--fading)} .bar.weak > span{background:var(--weak)}

.empty{
  border:1.5px dashed var(--line-2);border-radius:var(--r-l);padding:26px 18px;text-align:center;
  color:var(--ink-3);font-size:14px;display:flex;flex-direction:column;gap:12px;align-items:center;
}

/* ---------- today ---------- */
.hero{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);
  box-shadow:var(--shadow-2);overflow:hidden;
}
.hero-main{padding:22px 20px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.hero-figure{flex:none;width:104px;height:104px;position:relative;display:grid;place-items:center}
.hero-figure svg{position:absolute;inset:0;width:100%;height:100%}
.hero-figure .val{font-family:var(--mono);font-weight:600;font-size:30px;line-height:1}
.hero-figure .lab{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-top:2px}
.hero-copy{flex:1 1 240px;min-width:0;display:flex;flex-direction:column;gap:10px}
.hero-copy h1{font-size:clamp(22px,4.4vw,29px);line-height:1.12}
.hero-strip{display:flex;gap:0;border-top:1px solid var(--line);background:var(--surface-2)}
.hero-strip div{flex:1;padding:11px 14px;border-right:1px solid var(--line);min-width:0}
.hero-strip div:last-child{border-right:0}
.hero-strip .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.hero-strip .v{font-family:var(--mono);font-weight:600;font-size:17px;margin-top:1px}

/* term spine */
.spine{position:relative;padding:26px 4px 6px}
.spine-track{height:10px;border-radius:99px;background:var(--surface-3);position:relative;overflow:visible}
.spine-fill{position:absolute;inset:0 auto 0 0;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.spine-mark{position:absolute;top:-4px;width:3px;height:18px;border-radius:2px;background:var(--ink);transform:translateX(-50%)}
.spine-mark.mid{background:var(--mark)}
.spine-mark.end{background:var(--weak)}
.spine-now{position:absolute;top:-11px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px}
.spine-now .pin{width:13px;height:13px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}
.spine-labels{display:flex;justify-content:space-between;margin-top:9px;font-size:11.5px;color:var(--ink-3)}
.halves{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.half{border:1px solid var(--line);border-radius:var(--r-m);padding:12px;background:var(--surface-2)}
.half h4{font-size:13.5px;font-family:var(--sans);font-weight:700}
.half .test{font-size:12.5px;color:var(--ink-3);margin-top:4px}
.half .cnt{font-family:var(--mono);font-size:22px;font-weight:600;margin-top:8px}

/* subject + topic rows */
.subjblock{border-bottom:1px solid var(--line)}
.subjblock:last-child{border-bottom:0}
.subjhead{display:flex;align-items:center;gap:10px;padding:11px 16px;background:var(--surface-2);flex-wrap:wrap}
.topicrow{display:flex;align-items:center;gap:13px;padding:11px 16px 11px 30px;border-top:1px solid var(--line);flex-wrap:wrap}
.emptysubs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:13px 16px;border-top:1px solid var(--line)}
.topic-name{font-weight:600;font-size:14.5px;flex:1 1 130px;min-width:0}
.subj-dot{width:10px;height:10px;border-radius:3px;flex:none}
.subj-name{font-weight:600;font-size:15px;flex:1 1 130px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subj-meter{flex:2 1 150px;min-width:100px;display:flex;flex-direction:column;gap:5px}
.subj-meter .t{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3)}

/* forecast chart */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--mono);font-size:9px;fill:var(--ink-3)}
.chart .axis{stroke:var(--line);stroke-width:1}
.chart .barfill{fill:var(--accent)}
.chart .barfill.today{fill:var(--mark)}
.chart .curve{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round}
.chart .curve.decay{stroke:var(--weak);stroke-dasharray:5 4}
.chart .band{fill:var(--accent-soft);opacity:.55}

/* ---------- session overlay ---------- */
.session{
  position:fixed;inset:0;z-index:60;background:var(--paper);
  display:flex;flex-direction:column;
}
.s-top{
  display:flex;align-items:center;gap:12px;padding:10px 14px;
  border-bottom:1px solid var(--line);background:var(--surface);
}
.s-prog{flex:1;height:7px;border-radius:99px;background:var(--surface-3);overflow:hidden;min-width:60px}
.s-prog > span{display:block;height:100%;background:var(--accent);transition:width .3s ease}
.s-count{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.s-body{flex:1;overflow-y:auto;padding:18px 16px 24px;display:flex;justify-content:center}
.s-inner{width:100%;max-width:620px;display:flex;flex-direction:column;gap:16px;margin-block:auto}
.q-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);
  padding:22px 20px;box-shadow:var(--shadow-2);display:flex;flex-direction:column;gap:12px;
}
.q-meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.q-text{font-family:var(--display);font-weight:600;font-size:clamp(19px,3.6vw,25px);line-height:1.28}
.a-text{
  font-size:clamp(17px,3.2vw,21px);line-height:1.42;padding-top:14px;
  border-top:2px solid var(--accent-soft);color:var(--ink);
}
.a-text .lab{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:6px;font-family:var(--sans)}
.choices{display:flex;flex-direction:column;gap:9px}
.choice{
  text-align:left;padding:13px 15px;border-radius:var(--r-m);border:1.5px solid var(--line-2);
  background:var(--surface);font-size:15.5px;font-weight:500;display:flex;gap:11px;align-items:flex-start;
}
.choice .key{font-family:var(--mono);font-size:12px;color:var(--ink-3);padding-top:2px;flex:none}
.choice:hover:not([disabled]){border-color:var(--accent);background:var(--accent-soft)}
.choice[disabled]{pointer-events:none;opacity:.65}
.choice.right{border-color:var(--strong);background:var(--strong-soft);opacity:1}
.choice.wrong{border-color:var(--weak);background:var(--weak-soft);opacity:1}
.typerow{display:flex;gap:9px;align-items:stretch}
.typerow input{flex:1;font-size:16px}
.verdict{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;padding:10px 13px;border-radius:var(--r-m)}
.verdict.ok{background:var(--strong-soft);color:var(--strong)}
.verdict.near{background:var(--fading-soft);color:var(--fading)}
.verdict.no{background:var(--weak-soft);color:var(--weak)}
.s-foot{border-top:1px solid var(--line);background:var(--surface);padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
.s-foot-inner{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:9px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.grade{
  border-radius:var(--r-m);border:1.5px solid var(--line-2);background:var(--surface);
  padding:9px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:13px;font-weight:600;
}
.grade small{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);font-weight:500}
.grade.g0{color:var(--weak)} .grade.g0:hover{background:var(--weak-soft);border-color:var(--weak)}
.grade.g1{color:var(--fading)} .grade.g1:hover{background:var(--fading-soft);border-color:var(--fading)}
.grade.g2{color:var(--strong)} .grade.g2:hover{background:var(--strong-soft);border-color:var(--strong)}
.grade.g3{color:var(--accent)} .grade.g3:hover{background:var(--accent-soft);border-color:var(--accent)}
.dunno{
  width:100%;border-radius:var(--r-m);border:1.5px solid var(--weak);background:var(--weak-soft);
  color:var(--weak);padding:12px;font-size:15px;font-weight:700;
}
.dunno:hover{background:var(--weak);color:var(--surface)}
.kbd-hint{font-size:11px;color:var(--ink-3);text-align:center;font-family:var(--mono)}
@media (max-width:620px){.kbd-hint{display:none}}

/* results */
.score-ring{width:132px;height:132px;position:relative;display:grid;place-items:center;flex:none}
.score-ring svg{position:absolute;inset:0;width:100%;height:100%}
.score-ring .pct{font-family:var(--mono);font-weight:600;font-size:31px}
.miss-list{display:flex;flex-direction:column;gap:1px;background:var(--line);border-radius:var(--r-m);overflow:hidden}
.miss{background:var(--surface);padding:11px 14px;display:flex;gap:12px;align-items:flex-start}
.miss .qq{font-weight:600;font-size:14px}
.miss .aa{font-size:13.5px;color:var(--ink-2);margin-top:2px}

/* cards manager */
.topic-group{border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;background:var(--surface)}
.topic-head{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.topic-head h4{font-size:13.5px;font-family:var(--sans);font-weight:700;flex:1;min-width:0}
.cardrow{display:flex;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);align-items:flex-start}
.cardrow:last-child{border-bottom:0}
.cardrow .txt{flex:1;min-width:0}
.cardrow .q{font-weight:600;font-size:14.5px;word-wrap:break-word}
.cardrow .a{font-size:13.5px;color:var(--ink-2);margin-top:2px;word-wrap:break-word}
.strengthdot{width:34px;flex:none;text-align:right;font-family:var(--mono);font-size:12px;font-weight:600}
.tbl-scroll{overflow-x:auto}

/* memory page */
.sci{display:flex;flex-direction:column;gap:14px}
.sci h3{font-size:16px}
.sci p{font-size:14.5px;color:var(--ink-2);line-height:1.6;max-width:62ch}

<script>
"use strict";
/* =====================================================================
   Half-Term Recall — revision built around how memory actually decays.
   Single file, no build step. Works offline from localStorage; syncs
   through the artifact `db` capability when the page is published.
   ===================================================================== */

const BUILD = 7;          // bump on every publish — shown on the Memory tab
const DAY = 86400000;
const MIN = 60000;
const NAV = [
  {id:"today",  label:"Today",   ic:"◆"},
  {id:"revise", label:"Revise",  ic:"⟳"},
  {id:"tests",  label:"Tests",   ic:"✓"},
  {id:"cards",  label:"Cards",   ic:"▤"},
  {id:"memory", label:"Memory",  ic:"◠"},
];
const SUBJECT_COLORS = ["#0B6B6B","#B8651B","#5C4AA8","#1C7A54","#AF3A31","#1F6FA8","#8A5A12","#A03A78","#4B5563"];

/* ---------------------------------------------------------------- utils */
const $ = (sel, root=document) => root.querySelector(sel);
const uid = p => p + Math.random().toString(36).slice(2,9);
const clamp = (n,a,b) => Math.max(a, Math.min(b,n));
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayKey = (d=new Date()) => new Date(d.getTime() - d.getTimezoneOffset()*MIN).toISOString().slice(0,10);
const dayStart = ts => { const d = new Date(ts); d.setHours(0,0,0,0); return d.getTime(); };
const parseDate = s => { const [y,m,d] = String(s).split("-").map(Number); return new Date(y, m-1, d, 9, 0, 0).getTime(); };
const fmtDate = ts => new Date(ts).toLocaleDateString(undefined,{day:"numeric",month:"short"});
const fmtDateLong = ts => new Date(ts).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"long"});
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
function shuffle(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];} return r; }

function fmtInterval(days){
  if (days <= 0) return "now";
  if (days < 1) return Math.round(days*24*60) + "m";
  if (days < 30) return Math.round(days) + "d";
  if (days < 365) return (days/30.4).toFixed(days<60?1:0) + "mo";
  return (days/365).toFixed(1) + "y";
}
function fmtCountdown(ts){
  const d = Math.ceil((dayStart(ts) - dayStart(Date.now()))/DAY);
  if (d < 0) return {text:`${-d}d ago`, days:d};
  if (d === 0) return {text:"today", days:0};
  if (d === 1) return {text:"tomorrow", days:1};
  return {text:`in ${d} days`, days:d};
}

function toast(msg){
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  $("#toasts").appendChild(t);
  setTimeout(()=>{ t.style.opacity="0"; t.style.transition="opacity .3s"; }, 2100);
  setTimeout(()=> t.remove(), 2500);
}

/* levenshtein distance for typed-answer marking */
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=new Array(n+1); for(let j=0;j<=n;j++) prev[j]=j;
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur;
  }
  return prev[n];
}
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
  .replace(/[^a-z0-9\s]/g," ").replace(/\b(a|an|the)\b/g," ").replace(/\s+/g," ").trim();
function markTyped(given, answer){
  const g = norm(given), a = norm(answer);
  if (!g) return "no";
  if (g === a) return "ok";
  const d = lev(g,a), ratio = 1 - d/Math.max(g.length,a.length);
  if (ratio >= 0.86) return "ok";
  if (ratio >= 0.62 || a.includes(g) || g.includes(a)) return "near";
  return "no";
}

/* ------------------------------------------------------- memory model */
/* Retrievability of a memory trace t days after the last successful recall,
   with stability S (days): R = 0.9 ^ (t / S). At t = S, R = 90% — that is
   the moment the card becomes due, i.e. the last comfortable moment to
   rehearse before recall starts falling off a cliff. */
function stability(card){ return Math.max(card.intervalDays || 0, 0.02); }
function strength(card, at=Date.now()){
  if (!card.reps || !card.lastReview) return 0;
  const t = (at - card.lastReview)/DAY;
  return clamp(Math.pow(0.9, t/stability(card)), 0, 1);
}
function strengthClass(r){ return r >= 0.9 ? "strong" : r >= 0.7 ? "fading" : "weak"; }
function strengthWord(r){ return r >= 0.9 ? "Solid" : r >= 0.7 ? "Fading" : "At risk"; }

/* SM-2 flavoured scheduler. grade: 0 forgot · 1 hard · 2 good · 3 easy */
function applyGrade(card, grade){
  const now = Date.now();
  if (grade === 0){
    if (card.reps) card.lapses++;
    card.ease = clamp(card.ease - 0.2, 1.3, 3.2);
    card.intervalDays = 0.007;               // ~10 minutes
    card.state = card.reps ? "relearning" : "learning";
    card.due = now + 10*MIN;
  } else {
    card.reps++;
    if (card.state === "new" || card.state === "learning" || card.state === "relearning"){
      card.intervalDays = grade === 3 ? 3 : grade === 1 ? 0.5 : 1;
      card.state = "review";
    } else {
      const f = grade === 1 ? 1.2 : grade === 3 ? card.ease*1.35 : card.ease;
      card.intervalDays = clamp(Math.round(Math.max(1,card.intervalDays)*f), 1, 365);
      card.ease = clamp(card.ease + (grade===1 ? -0.15 : grade===3 ? 0.1 : 0), 1.3, 3.2);
    }
    card.due = now + card.intervalDays*DAY;
  }
  card.lastReview = now;
  card.seen = (card.seen||0) + 1;
}

/* ------------------------------------------------------------- storage */
const LS_KEY = "halfterm-recall/v1";

const Store = {
  db: null, dirty: new Set(), timer: null,

  async connect(){
    try { this.db = (window.claude && window.claude.use) ? await window.claude.use("db") : null; }
    catch(e){ this.db = null; }
    return this.db;
  },
  readLocal(){
    try { const raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : null; }
    catch(e){ return null; }
  },
  writeLocal(s){ try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch(e){} },

  /* Shape on the server: one meta doc + one doc per subject's deck, so a
     review only rewrites the subject you are actually studying. */
  async pull(){
    if (!this.db) return null;
    try {
      const metaSnap = await this.db.doc("app/meta").get();
      if (!metaSnap.exists) return null;
      const meta = metaSnap.data();
      const decks = await this.db.collection("decks").get();
      const cards = [];
      decks.docs.forEach(d => (d.data().cards || []).forEach(c => cards.push(c)));
      return {...meta, cards, updatedAt: meta.updatedAt || 0};
    } catch(e){ return null; }
  },
  async pushAll(s){
    if (!this.db) return;
    this.dirty.add("meta");
    s.subjects.forEach(sub => this.dirty.add("deck:" + sub.id));
    await this.flush(s);
  },
  mark(key){ this.dirty.add(key); },
  schedule(s){
    this.writeLocal(s);
    clearTimeout(this.timer);
    this.timer = setTimeout(()=> this.flush(s), 1400);
  },
  async flush(s){
    if (!this.db || !this.dirty.size) return;
    const keys = [...this.dirty]; this.dirty.clear();
    const stamp = Date.now();
    for (const k of keys){
      try {
        if (k === "meta"){
          const {cards, ...meta} = s;
          await this.db.doc("app/meta").set({...meta, updatedAt: stamp});
        } else {
          const id = k.slice(5);
          const cards = s.cards.filter(c => c.subjectId === id);
          await this.db.collection("decks").doc(id).set({cards, updatedAt: stamp});
        }
      } catch(e){ /* offline or revoked — localStorage still holds the truth */ }
    }
  }
};

/* ------------------------------------------------------------ card writer */
/* The page can ask Claude to write questions for a topic. Only available on
   the published version — standalone, `AI.sample` stays null and the panel
   falls back to writing cards by hand. */
const AI = {
  sample: null,
  resolved: false,        // false until we know whether the writer is available
  async connect(){
    try { this.sample = (window.claude && window.claude.use) ? await window.claude.use("sample") : null; }
    catch(e){ this.sample = null; }
    this.resolved = true;
    return this.sample;
  }
};

const gen = {status:"idle", items:[], msg:"", written:0, ctl:null, topic:"", notes:"", count:12};

function genPrompt(subject, topic, level, notes, count, avoid){
  return [
    `You are writing revision flashcards for a school student to test themselves on ONE specific topic.`,
    ``,
    `Subject: ${subject}`,
    `TOPIC (the only thing these cards may be about): ${topic}`,
    level ? `Level: ${level} (British curriculum)` : `Level: secondary school (British curriculum)`,
    notes ? `\nWhat the lesson actually covered. Every card must come from this and nothing outside it:\n${notes}` : "",
    avoid.length ? `\nAlready in the deck, so do not repeat these or write anything close to them:\n${avoid.map(q => "- " + q).join("\n")}` : "",
    ``,
    `Write ${count} flashcards on "${topic}" specifically.`,
    ``,
    `Staying on topic — this matters more than anything else below:`,
    `- Every card must test something you only know if you studied "${topic}". A question a student could answer from general ${subject} knowledge is a failed card.`,
    `- Go into the actual substance of the topic: its named parts, key terms, steps in order, numbers, units, dates, rules and common exceptions.`,
    `- Do not drift into neighbouring topics, the wider subject, or background context.`,
    notes ? `- The notes above set the boundary. If something is not in them, leave it out.`
          : `- Break "${topic}" into its specific sub-parts and spread the cards across all of them, rather than asking the same headline question several ways.`,
    ``,
    `Writing the cards:`,
    `- One fact, definition, rule or worked step per card — never two.`,
    `- The question must be answerable from memory in under 15 seconds.`,
    `- Keep answers short: under 12 words where you can, and never a paragraph.`,
    `- Use the topic's real vocabulary, units and notation.`,
    `- Mix definitions, key facts, "what happens if", and short worked examples with real numbers.`,
    `- British spelling and conventions.`,
    `- No duplicates and no near-duplicates of each other.`,
    ``,
    `Reply with only a JSON array of {"q": string, "a": string} objects.`,
    `Example for the topic "Enzymes": [{"q":"What happens to an enzyme above its optimum temperature?","a":"It denatures — the active site changes shape"}]`
  ].filter(x => x !== "").join("\n");
}

const GEN_ERRORS = {
  not_granted: "You didn't allow this page to use Claude, so card writing is off for now. Reload the page to be asked again.",
  sampling_disabled: "Claude isn't available on this account, so you'll need to write these cards yourself.",
  rate_limited: "That's a lot of questions at once — wait a minute and try again.",
  session_expired: "You've been signed out of Claude. Sign back in and try again.",
  refused: "Claude wouldn't write those. Try describing the topic differently.",
  empty_completion: "Nothing came back. Try a more specific topic.",
  invalid_json: "The answer came back in a shape the app couldn't read. Try again, or ask for fewer cards.",
  prompt_too_large: "Those notes are too long — paste a shorter chunk and generate in a couple of goes.",
  cancelled: "Stopped."
};

async function generateCards(more=false){
  const sel = viewCards.sel;
  const subject = subjectOf(sel.subjectId);
  if (!subject) return toast("Pick a subject first.");
  /* The form is gone once a batch is on screen, so "write more" reuses what was typed. */
  const val = (id, fallback) => { const el = $(id); return el ? el.value : fallback; };
  gen.topic = String(val("#genTopic", gen.topic)).trim();
  gen.notes = String(val("#genNotes", gen.notes)).trim();
  gen.count = clamp(Number(val("#genCount", gen.count)) || 12, 4, 30);
  gen.part = val("#genPart", gen.part || "A");
  const level = String(val("#genLevel", S.settings.level || "")).trim();
  if (level !== S.settings.level){ S.settings.level = level; save("meta"); }
  if (!gen.topic) return toast("Type the topic you're revising.");

  const existing = S.cards
    .filter(c => c.subjectId === subject.id && norm(c.topic) === norm(gen.topic))
    .map(c => c.q);
  const avoid = existing.concat(more ? gen.items.map(i => i.q) : []).slice(-45);

  const kept = more ? gen.items : [];
  gen.status = "thinking"; gen.items = kept; gen.msg = ""; gen.written = 0;
  gen.ctl = new AbortController();
  renderGen();

  try {
    const items = await AI.sample.json(
      genPrompt(subject.name, gen.topic, level, gen.notes, gen.count, avoid),
      {
        signal: gen.ctl.signal,
        cache: false,
        onText: ({text}) => {
          /* Only redraw when another question has landed, so the spinner
             doesn't restart several times a second. */
          const n = (text.match(/"q"\s*:/g) || []).length;
          if (gen.status === "writing" && n === gen.written) return;
          gen.status = "writing"; gen.written = n;
          renderGen();
        }
      }
    );
    const seen = new Set(kept.map(i => norm(i.q)).concat(existing.map(norm)));
    const clean = (Array.isArray(items) ? items : [])
      .map(o => ({q: String((o && o.q) || "").trim(), a: String((o && o.a) || "").trim(), keep: true}))
      .filter(o => {
        if (!o.q || !o.a || seen.has(norm(o.q))) return false;
        seen.add(norm(o.q)); return true;
      });
    if (!clean.length && !kept.length){ gen.status = "error"; gen.msg = GEN_ERRORS.empty_completion; }
    else { gen.status = "ready"; gen.items = kept.concat(clean); }
  } catch(e){
    const code = (e && e.code) || "upstream_error";
    if (code === "cancelled"){ gen.status = kept.length ? "ready" : "idle"; gen.msg = ""; }
    else if (kept.length){ gen.status = "ready"; toast(GEN_ERRORS[code] || "Couldn't reach Claude just then."); }
    else { gen.status = "error"; gen.msg = GEN_ERRORS[code] || "Something went wrong reaching Claude. Try again in a moment."; }
  }
  gen.ctl = null;
  renderGen();
}

function renderGen(){
  const host = $("#genPanel");
  if (!host) return;
  host.innerHTML = genPanelHTML();
  const box = $("#genTopic");
  if (box) box.addEventListener("keydown", e => {
    if (e.key === "Enter"){ e.preventDefault(); generateCards(false); }   // Enter writes the cards
  });
}

function genPanelHTML(){
  if (!AI.sample){
    return `<div class="banner"><span class="ic">✎</span><div>
      <b>Writing cards for you isn't available here.</b> It needs to ask Claude on your account, which only works
      on the published version of the app with permission granted. Use the box below to type cards out, or paste a
      whole lesson's worth at once.</div></div>`;
  }
  if (gen.status === "thinking" || gen.status === "writing"){
    return `<div class="stack">
      <div class="row"><span class="spinner" aria-hidden="true"></span>
        <b>${gen.status === "thinking" ? "Claude is reading the topic…" : `Writing your questions — ${gen.written} so far…`}</b></div>
      <p class="small muted">This takes up to a minute. It reads the topic and your notes, then writes one question per idea.</p>
      <button class="btn sm" data-act="gen-stop">Stop</button>
    </div>`;
  }
  if (gen.status === "ready"){
    const keep = gen.items.filter(i => i.keep).length;
    return `<div class="stack">
      <div class="spread">
        <b>${gen.items.length} questions on ${esc(gen.topic)}</b>
        <span class="small muted">untick anything you haven't been taught</span>
      </div>
      <div class="genlist">
        ${gen.items.map((it,i) => `
          <button class="genrow${it.keep?"":" off"}" data-act="gen-toggle" data-i="${i}" aria-pressed="${it.keep}">
            <span class="tick" aria-hidden="true">${it.keep?"✓":""}</span>
            <span class="gtxt"><span class="gq">${esc(it.q)}</span><span class="ga">${esc(it.a)}</span></span>
          </button>`).join("")}
      </div>
      <div class="row">
        <button class="btn primary" data-act="gen-add"${keep?"":" disabled"}>Add ${keep} card${keep===1?"":"s"}</button>
        <button class="btn" data-act="gen-run" data-more="1">Write ${gen.count} more</button>
        <button class="btn ghost" data-act="gen-discard">Discard</button>
      </div>
    </div>`;
  }
  const level = esc(S.settings.level || "");
  const t = termOf(viewCards.sel.termId) || currentTerm();
  return `<div class="stack">
    ${gen.status === "error" ? `<div class="verdict no" style="font-weight:500">${esc(gen.msg)}</div>` : ""}
    <label class="field">What topic are you doing?
      <input type="text" id="genTopic" list="genTopicList" autocomplete="off"
        placeholder="e.g. The light-dependent reaction, Solving linear equations" value="${esc(gen.topic)}">
      <datalist id="genTopicList">${
        topicsFor({subjectId: viewCards.sel.subjectId}).map(tp => `<option value="${esc(tp.name)}"></option>`).join("")
      }</datalist>
      <span class="small muted" style="font-weight:400">The narrower you name it, the sharper the questions — "Trigonometry: SOHCAHTOA"
        beats "Maths". Type a topic you already have to add more to it.</span></label>
    <div class="grid3">
      <label class="field">Your year / level
        <input type="text" id="genLevel" placeholder="e.g. Year 9" value="${level}"></label>
      <label class="field">How many
        <select id="genCount">${[8,12,16,20,25].map(n=>`<option value="${n}"${n===gen.count?" selected":""}>${n} cards</option>`).join("")}</select></label>
      <label class="field">Which half
        <select id="genPart">
          <option value="A"${currentPart(t)==="A"?" selected":""}>Part A — before the mid test</option>
          <option value="B"${currentPart(t)==="B"?" selected":""}>Part B — after the mid test</option>
        </select></label>
    </div>
    <label class="field">What you covered in the lesson <span class="muted" style="font-weight:400">— optional, but it makes the questions match your class</span>
      <textarea id="genNotes" rows="4" placeholder="Paste your notes, or just list what the lesson covered: light-dependent reaction, chlorophyll, the word equation, limiting factors…">${esc(gen.notes)}</textarea></label>
    <div class="row">
      <button class="btn primary" data-act="gen-run">Write my cards</button>
      <span class="small muted">Uses your Claude account. Check them before you add them.</span>
    </div>
  </div>`;
}

/* ------------------------------------------------------ default state */
function academicYearStart(now = new Date()){
  const y = now.getMonth() >= 7 ? now.getFullYear() : now.getFullYear()-1;
  return y;
}
function defaultTerms(){
  const y = academicYearStart();
  const spans = [
    ["Autumn 1", `${y}-09-02`, `${y}-10-23`],
    ["Autumn 2", `${y}-11-02`, `${y}-12-18`],
    ["Spring 1", `${y+1}-01-05`, `${y+1}-02-12`],
    ["Spring 2", `${y+1}-02-22`, `${y+1}-03-26`],
    ["Summer 1", `${y+1}-04-12`, `${y+1}-05-21`],
    ["Summer 2", `${y+1}-06-01`, `${y+1}-07-21`],
  ];
  return spans.map(([name,start,end],i) => {
    const s = parseDate(start), e = parseDate(end);
    const mid = new Date(s + Math.floor((e-s)/2));
    const endT = new Date(e - 3*DAY);
    return {
      id: "t"+(i+1), name, start, end,
      midTest: todayKey(mid), endTest: todayKey(endT),
      year: `${y}/${String(y+1).slice(2)}`
    };
  });
}

function newCard(o){
  return {
    id: uid("c_"), subjectId:o.subjectId, termId:o.termId, part:o.part||"A",
    topic:o.topic||"General", q:o.q, a:o.a, hint:o.hint||"",
    ease:2.5, intervalDays:0, reps:0, lapses:0, seen:0,
    due: Date.now(), lastReview:0, state:"new",
    example: !!o.example, created: Date.now()
  };
}

function freshState(){
  const terms = defaultTerms();
  const now = Date.now();
  const current = terms.find(t => now >= parseDate(t.start) && now <= parseDate(t.end)) || terms[0];
  const subjects = SUBJECTS.map((name,i) => ({id: uid("s_"), name, colorIdx: i % SUBJECT_COLORS.length}));
  const cards = [];
  SEED.forEach(([subName, topic, part, qs]) => {
    const sub = subjects.find(s => s.name === subName);
    if (!sub) return;
    qs.forEach(([q,a]) => cards.push(newCard({subjectId:sub.id, termId:current.id, part, topic, q, a, example:true})));
  });
  return {
    version: 1,
    settings: {dailyGoal: 25, reminderTime: "17:30", notify: false, lastNudge: 0, theme: "auto", level: "", dropped: []},
    subjects, terms, cards,
    days: {},            // "YYYY-MM-DD" -> {reviewed, correct}
    results: [],         // test results
    updatedAt: now
  };
}

/* Keep the subject list in step with SUBJECTS on every load: add any that
   are missing, and clear out an old seeded subject that never held anything
   but example cards. A subject you deleted on purpose stays deleted, and a
   subject you added yourself is never touched. */
function ensureSubjects(s){
  const listed = name => SUBJECTS.some(n => norm(n) === norm(name));
  const dropped = s.settings.dropped || [];
  SUBJECTS.forEach((name,i) => {
    if (dropped.some(d => norm(d) === norm(name))) return;
    if (!s.subjects.some(x => norm(x.name) === norm(name)))
      s.subjects.push({id: uid("s_"), name, colorIdx: i % SUBJECT_COLORS.length});
  });
  s.subjects = s.subjects.filter(sub =>
    listed(sub.name) || s.cards.some(c => c.subjectId === sub.id && !c.example));
  const live = new Set(s.subjects.map(x => x.id));
  s.cards = s.cards.filter(c => live.has(c.subjectId));
  const order = SUBJECTS.map(norm);
  s.subjects.sort((a,b) => {
    const ia = order.indexOf(norm(a.name)), ib = order.indexOf(norm(b.name));
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });
  return s;
}

function save(...keys){
  S.updatedAt = Date.now();

}

const subjectOf = id => S.subjects.find(s => s.id === id);
const termOf = id => S.terms.find(t => t.id === id);
const subjColor = sub => SUBJECT_COLORS[(sub && sub.colorIdx) || 0];

function currentTerm(){
  const now = Date.now();
  return S.terms.find(t => now >= parseDate(t.start) && now <= parseDate(t.end))
      || S.terms.find(t => now < parseDate(t.start))
      || S.terms[S.terms.length-1];
}
/* Part A up to the mid-half-term test, Part B after it. */
function currentPart(term){ return Date.now() <= parseDate(term.midTest) ? "A" : "B"; }

const newCards = () => S.cards.filter(c => !c.reps);
const dueReview = (at=Date.now()) => S.cards.filter(c => c.reps && c.due <= at);
/* "due" for the badge means everything worth doing now: fading reviews first, then unseen cards. */
const dueCards = (at=Date.now()) => dueReview(at).concat(newCards());

function cardsFor({termId, subjectId, part}={}){
  return S.cards.filter(c =>
    (!termId || c.termId === termId) &&
    (!subjectId || c.subjectId === subjectId) &&
    (!part || c.part === part || part === "AB"));
}
function readiness(cards){
  if (!cards.length) return null;
  const total = cards.reduce((n,c) => n + strength(c), 0);
  return total / cards.length;
}

/* Topics are the real unit of work — a test is on "Photosynthesis", not on
   "Biology" — so progress, revision and mocks are all reckoned per topic.
   A topic is identified by its subject plus its name, compared loosely so
   "photosynthesis" and "Photosynthesis " are the same topic. */
const topicKey = (subjectId, name) => subjectId + "::" + norm(name);

function topicsFor(filter={}){
  const map = new Map();
  cardsFor(filter).forEach(c => {
    const key = topicKey(c.subjectId, c.topic);
    let e = map.get(key);
    if (!e){ e = {key, name: c.topic, subjectId: c.subjectId, termId: c.termId, cards: [], parts: new Set()}; map.set(key, e); }
    e.cards.push(c); e.parts.add(c.part);
  });
  const now = Date.now();
  return [...map.values()].map(e => ({
    key: e.key, name: e.name, subjectId: e.subjectId, termId: e.termId, cards: e.cards,
    part: e.parts.size > 1 ? "A+B" : [...e.parts][0],
    strength: readiness(e.cards) || 0,
    due: e.cards.filter(c => c.reps && c.due <= now).length,
    unseen: e.cards.filter(c => !c.reps).length
  })).sort((a,b) => a.strength - b.strength || a.name.localeCompare(b.name));
}
const cardsInTopic = key => S.cards.filter(c => topicKey(c.subjectId, c.topic) === key);

/* Reuse the spelling already in the deck so "Photosynthesis" and
   "photosynthesis" don't become two topics you revise separately. */
function canonicalTopic(subjectId, name){
  const hit = S.cards.find(c => c.subjectId === subjectId && norm(c.topic) === norm(name));
  return hit ? hit.topic : name;
}
function streak(){
  let n = 0;
  for (let i=0;i<400;i++){
    const k = todayKey(new Date(Date.now() - i*DAY));
    const d = S.days[k];
    if (d && d.reviewed > 0) n++;
    else if (i > 0) break;
  }
  return n;
}
function logReview(correct){
  const k = todayKey();
  const d = S.days[k] || (S.days[k] = {reviewed:0, correct:0});
  d.reviewed++; if (correct) d.correct++;
}

function banner(){
  const ex = S.cards.filter(c => c.example).length;
  if (!ex) return "";
  return `<div class="banner">
    <span class="ic">✎</span>
    <div style="flex:1">

      <a href="#/cards" style="color:inherit">Cards</a> — then clear these out.
      <div style="margin-top:8px"><button class="btn sm" data-act="clear-examples">Clear example cards</button></div>
    </div>
  </div>`;
}

function donut(frac, size, color){
  const r = size/2 - 6, c = 2*Math.PI*r, off = c*(1-clamp(frac,0,1));
  return `<svg viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="8"></circle>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="8"
      stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"
      transform="rotate(-90 ${size/2} ${size/2})"></circle>
  </svg>`;
}

function termSpine(t){
  const s = parseDate(t.start), e = parseDate(t.end);
  const span = Math.max(e - s, DAY);
  const pos = ts => clamp((ts - s)/span, 0, 1)*100;
  const now = clamp((Date.now() - s)/span, 0, 1)*100;
  return `<div class="spine">
    <div class="spine-track">
      <div class="spine-fill" style="width:${now.toFixed(1)}%"></div>
      <div class="spine-mark mid" style="left:${pos(parseDate(t.midTest)).toFixed(1)}%" title="Mid-half-term test"></div>
      <div class="spine-mark end" style="left:${pos(parseDate(t.endTest)).toFixed(1)}%" title="End-of-half-term test"></div>
      <div class="spine-now" style="left:${now.toFixed(1)}%"><div class="pin"></div></div>
    </div>
    <div class="spine-labels">
      <span>${fmtDate(s)} · starts</span>
      <span>◆ ${fmtDate(parseDate(t.midTest))} mid test</span>
      <span>${fmtDate(parseDate(t.endTest))} big test</span>
    </div>
  </div>`;
}

function halfCard(t, part, testTs, testName){
  const cards = part === "A" ? cardsFor({termId:t.id, part:"A"}) : cardsFor({termId:t.id, part:"B"});
  const scope = part === "A" ? "the first half of the half-term" : "everything from the whole half-term";
  const r = readiness(part === "A" ? cards : cardsFor({termId:t.id}));
  const cd = fmtCountdown(testTs);
  return `<div class="half">
    <h4>Part ${part} · ${testName}</h4>
    <div class="test">${cd.text} — ${fmtDate(testTs)}. Covers ${scope}.</div>
    <div class="cnt">${cards.length}<span class="small muted" style="font-family:var(--sans);font-weight:400"> cards</span></div>
    <div class="bar ${r===null?"":strengthClass(r)}" style="margin-top:8px"><span style="width:${r===null?0:Math.round(r*100)}%"></span></div>
  </div>`;
}

function subjectBlock(sub, t){
  const cards = cardsFor({termId:t.id, subjectId:sub.id});

  const topics = topicsFor({termId:t.id, subjectId:sub.id});

function topicRow(tp){
  const pct = Math.round(tp.strength*100);
  const note = tp.unseen === tp.cards.length ? `${tp.cards.length} cards, none studied yet`
    : tp.due ? `${tp.cards.length} cards · <b style="color:var(--mark)">${tp.due} fading</b>`
    : `${tp.cards.length} cards`;
  return `<div class="topicrow">
    <span class="topic-name">${esc(tp.name)}</span>
    <span class="chip ${tp.part==="A"?"a":tp.part==="B"?"b":"outline"}">Part ${tp.part}</span>
    <div class="subj-meter">
      <div class="t"><span>${note}</span>
        <span class="num">${tp.cards.length && tp.unseen < tp.cards.length ? pct+"%" : "—"}</span></div>
      <div class="bar ${strengthClass(tp.strength)}"><span style="width:${pct}%"></span></div>
    </div>
    <button class="btn sm" data-act="start-topic" data-key="${esc(tp.key)}">Revise</button>
  </div>`;
}

function forecastChart(){
  const days = 14, W = 640, H = 150, padL = 26, padB = 22, padT = 10;
  const start = dayStart(Date.now());
  const counts = new Array(days).fill(0);
  S.cards.forEach(c => {
    const i = Math.floor((dayStart(c.due) - start)/DAY);
    if (i >= 0 && i < days) counts[i]++;
    else if (i < 0) counts[0]++;
  });
  const max = Math.max(4, ...counts);
  const bw = (W - padL - 8)/days;
  const bars = counts.map((n,i) => {
    const h = (H - padB - padT) * (n/max);
    const x = padL + i*bw + bw*0.16, y = H - padB - h;
    return `<rect class="barfill${i===0?" today":""}" x="${x.toFixed(1)}" y="${y.toFixed(1)}"
      width="${(bw*0.68).toFixed(1)}" height="${Math.max(h,n?2:0).toFixed(1)}" rx="2.5"></rect>
      ${n?`<text x="${(x+bw*0.34).toFixed(1)}" y="${(y-3).toFixed(1)}" text-anchor="middle">${n}</text>`:""}`;
  }).join("");
  const labels = counts.map((n,i) => {
    if (i%2 && i!==0) return "";
    const d = new Date(start + i*DAY);
    return `<text x="${(padL + i*bw + bw*0.5).toFixed(1)}" y="${H-padB+13}" text-anchor="middle">${i===0?"today":d.getDate()+"/"+(d.getMonth()+1)}</text>`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cards becoming due over the next 14 days">
    <line class="axis" x1="${padL}" y1="${H-padB}" x2="${W-4}" y2="${H-padB}"></line>
    <text x="4" y="${padT+8}">${max}</text><text x="4" y="${H-padB}">0</text>
    ${bars}${labels}
  </svg>`;
}

function decayChart(){
  const W = 640, H = 190, padL = 34, padR = 10, padT = 14, padB = 26;
  const days = 30;
  const x = d => padL + (d/days)*(W-padL-padR);
  const y = r => padT + (1-r)*(H-padT-padB);

  // no revision: one study session, S = 1 day
  let decay = [];
  for (let d=0; d<=days; d+=0.25) decay.push(`${x(d).toFixed(1)},${y(Math.pow(0.9, d/1)).toFixed(1)}`);

  // spaced: review whenever R hits 0.9, stability multiplies by the ease each time
  let pts = [], t = 0, S0 = 1, ease = 2.5, marks = [];
  while (t <= days){
    const end = Math.min(t + S0, days);
    for (let d=t; d<=end; d+=0.25) pts.push(`${x(d).toFixed(1)},${y(Math.pow(0.9,(d-t)/S0)).toFixed(1)}`);
    if (end >= days) break;
    marks.push(end);
    pts.push(`${x(end).toFixed(1)},${y(1).toFixed(1)}`);
    t = end; S0 = S0*ease;
  }
  const gridY = [1,0.9,0.5,0].map(r =>
    `<line class="axis" x1="${padL}" y1="${y(r)}" x2="${W-padR}" y2="${y(r)}" ${r===0.9?'stroke-dasharray="4 4"':""}></line>
     <text x="4" y="${(y(r)+3).toFixed(1)}">${Math.round(r*100)}%</text>`).join("");
  const marksSvg = marks.map(m =>
    `<circle cx="${x(m).toFixed(1)}" cy="${y(0.9).toFixed(1)}" r="3.6" fill="var(--accent)"></circle>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Forgetting curve with and without spaced review" style="margin-top:14px">
    ${gridY}
    <polyline class="curve decay" points="${decay.join(" ")}"></polyline>
    <polyline class="curve" points="${pts.join(" ")}"></polyline>
    ${marksSvg}
    <text x="${padL}" y="${H-8}">day 0</text>
    <text x="${W-padR}" y="${H-8}" text-anchor="end">day 30</text>
    <text x="${x(6).toFixed(1)}" y="${(y(0.18)).toFixed(1)}" fill="var(--weak)">no revision</text>
    <text x="${x(11).toFixed(1)}" y="${(y(0.97)).toFixed(1)}" fill="var(--accent)">reviewed at the edge</text>
  </svg>`;
}
