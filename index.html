/* ========================== SESSION ENGINE ========================== */
/*  A session is a queue of items. An item leaves only when `needed`
    reaches 0. Forgetting a card sets needed back to 2 and pushes it a
    few places down the queue, so you meet it again almost immediately
    and then once more later — spacing inside the session itself.      */

function startSession(cards, opts={}){
  if (!cards.length){ toast("No cards in there yet."); return; }
  const items = shuffle(cards).map(c => ({id:c.id, needed:1, worst:3, wrong:0}));
  session = {
    queue: items, mode: opts.mode || "mixed", test: !!opts.test,
    title: opts.title || "Revision", kind: opts.kind, termId: opts.termId,
    subjectId: opts.subjectId, topicName: opts.topicName || "",
    total: items.length, done: 0, answered: 0, correct: 0,
    revealed: false, verdict: null, chosen: null, results: [], finished: false
  };
  document.body.style.overflow = "hidden";
  renderSession();
}
function endSession(rerender=true){
  session = null;
  document.body.style.overflow = "";
  $("#overlay").innerHTML = "";
  if (rerender) render();
}

const sCard = () => S.cards.find(c => c.id === session.queue[0].id);

function modeFor(card){
  const m = session.mode;
  if (m !== "mixed") return m;
  const short = card.a.length <= 26;
  const pool = ["flash","flash","choice"];
  if (short) pool.push("type","choice");
  return pick(pool);
}
/* Wrong options should be plausible, so take them from the same topic first,
   then the same subject, and only fall back to other subjects if it's a thin deck. */
function distractors(card, n=3){
  const usable = c => c.id !== card.id && norm(c.a) !== norm(card.a);
  const tiers = [
    S.cards.filter(c => usable(c) && c.subjectId === card.subjectId && c.topic === card.topic),
    S.cards.filter(c => usable(c) && c.subjectId === card.subjectId),
    S.cards.filter(c => usable(c) && c.termId === card.termId),
    S.cards.filter(usable)
  ];
  const seen = new Set([norm(card.a)]), out = [];
  tiers.forEach(tier => shuffle(tier).forEach(c => {
    if (out.length < n && !seen.has(norm(c.a))){ seen.add(norm(c.a)); out.push(c.a); }
  }));
  return out;
}

function renderSession(){
  if (!session) return;
  if (session.finished) return renderResults();
  const item = session.queue[0];
  if (!item) return finishSession();
  const card = sCard();
  if (!card){ session.queue.shift(); return renderSession(); }
  if (!session.view) session.view = modeFor(card);

  const sub = subjectOf(card.subjectId);
  const left = session.queue.length;
  const toNail = session.queue.filter(i => i.needed > 1 || i.wrong).length;
  const prog = session.total ? session.done/session.total : 0;

  const body = session.view === "choice" ? choiceBody(card)
             : session.view === "type" ? typeBody(card)
             : flashBody(card);

  $("#overlay").innerHTML = `
  <div class="session" role="dialog" aria-label="${esc(session.title)}">
    <div class="s-top">
      <button class="iconbtn" data-act="quit" title="Finish session" aria-label="Finish session">✕</button>
      <div class="s-prog"><span style="width:${(prog*100).toFixed(1)}%"></span></div>
      <span class="s-count">${left} to go${toNail?` · ${toNail} to nail`:""}</span>
    </div>
    <div class="s-body"><div class="s-inner">
      <div class="q-card">
        <div class="q-meta">
          <span class="chip" style="background:${subjColor(sub)}1a;color:${subjColor(sub)}">${esc(sub?sub.name:"—")}</span>
          <span class="chip outline">${esc(card.topic)}</span>
          <span class="chip ${card.part==="A"?"a":"b"}">Part ${card.part}</span>
          ${item.wrong?`<span class="chip weak">missed ${item.wrong}× — again</span>`:""}
        </div>
        <div class="q-text">${esc(card.q)}</div>
        ${body}
      </div>
      ${session.revealed && !session.test ? nextUpNote(card) : ""}
    </div></div>
    <div class="s-foot"><div class="s-foot-inner">${footer(card)}</div></div>
  </div>`;

  const inp = $("#typeInput");
  if (inp && !session.revealed) inp.focus();
}

function flashBody(card){
  if (!session.revealed) return card.hint ? `<p class="small muted">Hint: ${esc(card.hint)}</p>` : "";
  return `<div class="a-text"><span class="lab">Answer</span>${esc(card.a)}</div>`;
}
function choiceBody(card){
  if (!session.choices) session.choices = shuffle([card.a, ...distractors(card)]);
  return `<div class="choices">${session.choices.map((c,i) => {
    let cls = "choice";
    if (session.revealed){
      if (c === card.a) cls += " right";
      else if (session.chosen === c) cls += " wrong";
    }
    return `<button class="${cls}" data-act="choose" data-val="${esc(c)}"${session.revealed?" disabled":""}>
      <span class="key">${i+1}</span><span>${esc(c)}</span></button>`;
  }).join("")}</div>`;
}
function typeBody(card){
  if (!session.revealed){
    return `<div class="typerow">
      <input type="text" id="typeInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer…">
      <button class="btn primary" data-act="submit-type">Check</button>
    </div>`;
  }
  const v = session.verdict;
  return `<div class="stack">
    <div class="verdict ${v}">${v==="ok"?"✓ Correct":v==="near"?"≈ Nearly — check the wording":"✕ Not quite"}
      ${session.typed?`<span class="muted" style="font-weight:400">· you put “${esc(session.typed)}”</span>`:""}</div>
    <div class="a-text"><span class="lab">Answer</span>${esc(card.a)}</div>
  </div>`;
}

function nextUpNote(card){
  if (session.verdict === "no") return `<p class="small muted" style="text-align:center">You'll meet this one again in a moment, and it's booked back in for tomorrow.</p>`;
  const preview = card.state === "new" || !card.reps ? "1 day" : fmtInterval(clamp(Math.round(Math.max(1,card.intervalDays)*card.ease),1,365));
  return `<p class="small muted" style="text-align:center">Getting this right moves it to about <span class="num">${preview}</span> away.</p>`;
}

function footer(card){
  if (session.test){
    if (!session.revealed){
      return `<div class="stack">
        ${session.view==="flash"?`<button class="btn primary wide" data-act="reveal-test">Show the answer</button>`:""}
        <button class="dunno" data-act="dunno-test">I don't know</button>
      </div>`;
    }
    /* A flashcard has nothing to mark it against, so you mark it yourself —
       honestly, the way you would against a mark scheme. */
    if (session.verdict === null){
      return `<div class="grades" style="grid-template-columns:1fr 1fr">
        <button class="grade g0" data-act="mark-test" data-ok="0">Got it wrong<small>goes on the fix list</small></button>
        <button class="grade g2" data-act="mark-test" data-ok="1">Got it right<small>counts as a mark</small></button>
      </div>`;
    }
    return `<button class="btn primary wide" data-act="next-test">Next question</button>`;
  }
  if (!session.revealed){
    return `<div class="stack">
      ${session.view==="flash"?`<button class="btn primary wide" data-act="reveal">Show the answer</button>`:""}
      <button class="dunno" data-act="dunno">I don't know — tell me</button>
      <div class="kbd-hint">space = show · 1–4 = how it went · D = I don't know</div>
    </div>`;
  }
  /* Saying you didn't know it settles the grade — no chance to talk yourself
     into "got it" once the answer is on the screen. */
  if (session.verdict === "no"){
    return `<div class="stack">
      <button class="btn primary wide" data-act="grade" data-g="0">Read it, got it — ask me again shortly</button>
      <div class="kbd-hint">this card comes back in 3 questions, and again before you finish</div>
    </div>`;
  }
  const suggested = session.verdict === "near" ? 1 : null;
  return `<div class="stack">
    <div class="grades">
      ${grade(0,"Forgot","again",suggested===0)}
      ${grade(1,"Hard",fmtInterval(card.reps?Math.max(1,card.intervalDays)*1.2:0.5),suggested===1)}
      ${grade(2,"Got it",fmtInterval(card.reps&&card.state==="review"?Math.max(1,card.intervalDays)*card.ease:1))}
      ${grade(3,"Easy",fmtInterval(card.reps&&card.state==="review"?Math.max(1,card.intervalDays)*card.ease*1.35:3))}
    </div>
    <div class="kbd-hint">1 forgot · 2 hard · 3 got it · 4 easy</div>
  </div>`;
}
function grade(g, label, sub, hi){
  return `<button class="grade g${g}" data-act="grade" data-g="${g}"${hi?' style="border-color:currentColor"':""}>
    ${label}<small>${sub}</small></button>`;
}

function reveal(verdict){
  session.revealed = true;
  session.verdict = verdict || null;
  renderSession();
}

function answer(grade){
  const item = session.queue[0], card = sCard();
  item.worst = Math.min(item.worst, grade);
  session.answered++;
  if (grade > 0) session.correct++;
  logReview(grade > 0);

  if (grade === 0){
    item.needed = 2; item.wrong++;
    session.queue.shift();
    session.queue.splice(Math.min(3, session.queue.length), 0, item);
  } else {
    item.needed--;
    session.queue.shift();
    if (item.needed > 0){
      session.queue.splice(Math.min(6, session.queue.length), 0, item);
    } else {
      applyGrade(card, item.worst);
      session.done++;
      saveCard(card);
    }
  }
  session.revealed = false; session.verdict = null; session.chosen = null;
  session.choices = null; session.view = null; session.typed = "";
  save("meta");
  if (!session.queue.length) return finishSession();
  renderSession();
}

/* test mode: one pass, graded at the end */
function testAnswer(correct){
  const item = session.queue[0], card = sCard();
  session.answered++;
  if (correct) session.correct++;
  session.results.push({cardId: card.id, correct});
  logReview(correct);
  session.queue.shift();
  session.done++;
  session.revealed = false; session.verdict = null; session.chosen = null;
  session.choices = null; session.view = null; session.typed = "";
  if (!session.queue.length) return finishSession();
  renderSession();
}

function finishSession(){
  if (session.test){
    const missed = session.results.filter(r => !r.correct).map(r => r.cardId);
    // A mock counts as real practice: right answers schedule forward, wrong ones come back tomorrow.
    session.results.forEach(r => {
      const c = S.cards.find(x => x.id === r.cardId);
      if (c){ applyGrade(c, r.correct ? 2 : 0); if (!r.correct) c.due = Date.now() + 12*3600000; }
    });
    S.results.push({
      id: uid("r_"), termId: session.termId, subjectId: session.subjectId || "",
      kind: session.kind, topic: session.topicName || "",
      date: Date.now(), score: session.correct, total: session.total, missed
    });
    Store.mark("meta"); S.subjects.forEach(s => Store.mark("deck:"+s.id)); Store.schedule(S);
    session.finished = true;
    return renderResults();
  }
  session.finished = true;
  save("meta");
  renderResults();
}

function renderResults(){
  const isTest = session.test;
  const pct = session.total ? Math.round((session.correct/Math.max(session.answered,1))*100) : 0;
  const score = isTest ? Math.round(session.correct/session.total*100) : pct;
  const missed = isTest ? session.results.filter(r => !r.correct) : [];
  const ring = donut(score/100, 132, score>=90?"var(--strong)":score>=70?"var(--fading)":"var(--weak)");
  const headline = isTest
    ? (score>=90 ? "Full marks territory." : score>=70 ? "Close. The gap is a short list." : "Good — now you know exactly what to fix.")
    : "Session done.";

  $("#overlay").innerHTML = `
  <div class="session">
    <div class="s-top">
      <button class="iconbtn" data-act="quit" aria-label="Close">✕</button>
      <div class="s-count" style="margin-left:auto">${esc(session.title)}</div>
    </div>
    <div class="s-body"><div class="s-inner">
      <div class="q-card" style="align-items:center;text-align:center">
        <div class="score-ring">${ring}<div><div class="pct">${score}%</div></div></div>
        <h2 style="font-size:21px">${headline}</h2>
        <p class="muted">${isTest
          ? `You got <b>${session.correct} of ${session.total}</b> right.`
          : `<b>${session.total}</b> cards nailed · <b>${session.answered}</b> questions answered.`}</p>
      </div>

      ${missed.length ? `<div class="card pad">
        <div class="sec-head"><h3 style="font-size:16px">The ${missed.length} to fix</h3></div>
        <div class="miss-list">${missed.map(r => {
          const c = S.cards.find(x => x.id === r.cardId); if (!c) return "";
          return `<div class="miss"><div><div class="qq">${esc(c.q)}</div><div class="aa">${esc(c.a)}</div></div></div>`;
        }).join("")}</div>
        <button class="btn primary wide" data-act="fix-missed" style="margin-top:14px">Drill these until they stick</button>
      </div>` : ""}

      ${!isTest && session.total ? `<div class="card pad">
        <p class="small muted" style="text-align:center">These cards are booked back in for the day your recall of each
        drops to 90%. The badge at the top will tell you when.</p></div>` : ""}

      <button class="btn wide" data-act="quit">Done</button>
    </div></div>
  </div>`;
}

/* ============================== EVENTS ============================== */

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  const A = ACTIONS[act];
  if (A){ e.preventDefault(); A(el); }
});

const ACTIONS = {
  /* --- starting sessions --- */
  "start-due": () => {
    const rev = dueReview(), nw = newCards();
    startSession(rev.length ? rev : nw.length ? nw : shuffle(S.cards).slice(0,20),
                 {title: rev.length ? "Cards that are fading" : nw.length ? "New cards" : "Free practice"});
  },
  "start-new": () => startSession(newCards(), {title:"New cards"}),
  "start-weak": () => startSession(S.cards.filter(c => c.reps && strength(c) < 0.7), {title:"Weak spots"}),
  "start-leech": () => startSession(S.cards.filter(c => c.lapses >= 3), {title:"Tricky cards"}),
  "start-custom": () => {
    const {cards, title} = customSelection();
    startSession(cards, {mode: $("#rvMode").value, title});
  },
  "start-topic": el => {
    const cards = cardsInTopic(el.dataset.key);
    const name = cards.length ? cards[0].topic : "Topic";
    const due = cards.filter(c => c.reps && c.due <= Date.now());
    startSession(due.length >= 4 ? due : cards, {title: name});
  },
  "start-topic-test": () => {
    const key = $("#ttTopic").value;
    if (!key) return toast("Pick a topic to be tested on.");
    const cards = cardsInTopic(key);
    const name = cards.length ? cards[0].topic : "Topic";
    startSession(cards, {
      test:true, kind:"topic", termId: currentTerm().id,
      subjectId: cards[0] && cards[0].subjectId, topicName: name,
      title: `${name} · topic test`
    });
  },
  "start-test": el => {
    const t = currentTerm(), kind = el.dataset.kind;
    const cards = kind === "mid" ? cardsFor({termId:t.id, part:"A"}) : cardsFor({termId:t.id});
    startSession(cards, {
      test:true, kind, termId:t.id, mode:"mixed",
      title: `${t.name} · ${kind==="mid"?"mid-half-term":"whole half-term"} mock`
    });
  },
  "fix-missed": () => {
    const ids = session.results.filter(r => !r.correct).map(r => r.cardId);
    const cards = S.cards.filter(c => ids.includes(c.id));
    endSession(false);
    startSession(cards, {title:"Fixing what you missed"});
  },

  /* --- inside a session --- */
  "reveal": () => reveal(),
  "reveal-test": () => reveal(),
  "dunno": () => reveal("no"),
  "dunno-test": () => reveal("no"),
  "next-test": () => testAnswer(session.verdict === "ok"),
  "mark-test": el => testAnswer(el.dataset.ok === "1"),
  "grade": el => answer(Number(el.dataset.g)),
  "choose": el => {
    const card = sCard(), val = el.dataset.val;
    session.chosen = val;
    reveal(val === card.a ? "ok" : "no");
  },
  "submit-type": () => {
    const card = sCard(), given = ($("#typeInput")||{}).value || "";
    session.typed = given.trim();
    reveal(markTyped(given, card.a));
  },
  "quit": () => {
    if (session && !session.finished && session.done < session.total && session.answered > 0) {
      if (!confirm("Finish here? Cards you haven't answered stay due.")) return;
    }
    endSession();
  },

  /* --- the card writer --- */
  "topic-for": el => {
    viewCards.sel = {subjectId: el.dataset.id, termId: currentTerm().id};
    gen.status = "idle"; gen.items = []; gen.topic = ""; gen.notes = "";
    go("cards");
  },
  "gen-run": el => generateCards(el.dataset.more === "1"),
  "gen-stop": () => { if (gen.ctl) gen.ctl.abort(); },
  "gen-toggle": el => {
    const it = gen.items[Number(el.dataset.i)];
    if (it){ it.keep = !it.keep; renderGen(); }
  },
  "gen-discard": () => { gen.status = "idle"; gen.items = []; gen.msg = ""; renderGen(); },
  "gen-add": () => {
    const keep = gen.items.filter(i => i.keep);
    if (!keep.length) return;
    const sel = viewCards.sel;
    const topic = canonicalTopic(sel.subjectId, gen.topic);
    keep.forEach(i => S.cards.push(newCard({
      subjectId: sel.subjectId, termId: sel.termId, part: gen.part || "A",
      topic, q: i.q, a: i.a
    })));
    save("meta", "deck:" + sel.subjectId);
    gen.status = "idle"; gen.items = []; gen.notes = "";
    toast(`${keep.length} cards added to ${topic}.`);
    render();
  },

  /* --- cards management --- */
  "toggle-manual": () => { viewCards.manual = !viewCards.manual; render(); },
  "toggle-bulk": () => { const b = $("#bulkBox"); b.hidden = !b.hidden; if (!b.hidden) $("#adBulk").focus(); },
  "add-card": () => {
    const q = $("#adQ").value.trim(), a = $("#adA").value.trim();
    if (!q || !a) return toast(AI.sample
      ? "This box needs a question and an answer. For cards from a topic, use the box above."
      : "This box needs both a question and an answer.");
    const topic = canonicalTopic(viewCards.sel.subjectId, $("#adTopic").value.trim() || "General");
    viewCards.lastTopic = topic;
    const c = newCard({subjectId: viewCards.sel.subjectId, termId: viewCards.sel.termId, part: $("#adPart").value, topic, q, a});
    S.cards.push(c); saveCard(c);
    toast("Card added."); render();
  },
  "add-bulk": () => {
    const raw = $("#adBulk").value;
    let topic = canonicalTopic(viewCards.sel.subjectId, $("#adTopic").value.trim() || "General");
    const part = $("#adPart").value;
    let n = 0;
    raw.split("\n").forEach(line => {
      const s = line.trim();
      if (!s) return;
      if (s.startsWith("#")){ topic = canonicalTopic(viewCards.sel.subjectId, s.replace(/^#+\s*/,"") || topic); return; }
      const m = s.split(/\s*\|\s*|\s*::\s*|\s+—\s+/);
      if (m.length < 2 || !m[0].trim() || !m[1].trim()) return;
      S.cards.push(newCard({subjectId: viewCards.sel.subjectId, termId: viewCards.sel.termId, part, topic,
                            q: m[0].trim(), a: m.slice(1).join(" | ").trim()}));
      n++;
    });
    if (!n) return toast("Couldn't read any lines — use question | answer.");
    save("meta", "deck:" + viewCards.sel.subjectId);
    toast(`${n} cards added.`); render();
  },
  "del-card": el => {
    const c = S.cards.find(x => x.id === el.dataset.id); if (!c) return;
    S.cards = S.cards.filter(x => x.id !== c.id);
    saveCard(c); render();
  },
  "new-subject": () => {
    const name = prompt("Subject name (e.g. Chemistry)");
    if (!name || !name.trim()) return;
    const sub = {id: uid("s_"), name: name.trim(), colorIdx: S.subjects.length % SUBJECT_COLORS.length};
    S.subjects.push(sub);
    viewCards.sel.subjectId = sub.id;
    save("meta", "deck:"+sub.id); render();
  },
  "del-subject": () => {
    const sub = subjectOf(viewCards.sel.subjectId); if (!sub) return;
    const n = S.cards.filter(c => c.subjectId === sub.id).length;
    if (!confirm(`Delete ${sub.name} and its ${n} cards? This can't be undone.`)) return;
    S.cards = S.cards.filter(c => c.subjectId !== sub.id);
    S.subjects = S.subjects.filter(s => s.id !== sub.id);
    /* Remember it so the standard list doesn't put it back on the next load. */
    S.settings.dropped = (S.settings.dropped || []).concat(sub.name);
    viewCards.sel.subjectId = S.subjects[0] ? S.subjects[0].id : "";
    if (Store.db) Store.db.collection("decks").doc(sub.id).delete().catch(()=>{});
    save("meta"); render();
  },
  "clear-examples": () => {
    if (!confirm("Remove the example cards?")) return;
    const subs = new Set(S.cards.filter(c => c.example).map(c => c.subjectId));
    S.cards = S.cards.filter(c => !c.example);   // the subjects themselves stay
    save("meta", ...[...subs].map(id => "deck:"+id));
    toast("Examples cleared — the app is yours now."); render();
  },

  /* --- settings --- */
  "notify": async () => {
    if (!("Notification" in window)) return toast("This browser can't show reminders.");
    if (S.settings.notify){ S.settings.notify = false; save("meta"); render(); return; }
    let p = Notification.permission;
    if (p !== "granted") p = await Notification.requestPermission();
    if (p === "granted"){
      S.settings.notify = true; save("meta");
      new Notification("Reminders on", {body:"You'll get a nudge when your cards start fading."});
    } else toast("Your browser blocked reminders.");
    render();
  },
  "export": async () => {
    const json = JSON.stringify(S, null, 2);
    const filename = `half-term-recall-${todayKey()}.json`;
    /* Published as an Artifact the page can't hand over a file directly —
       the downloads capability asks the viewer first. Standalone, a plain
       object URL is all it takes. */
    let dl = null;
    try { dl = (window.claude && window.claude.use) ? await window.claude.use("downloads") : null; } catch(e){}
    if (dl){
      try { await dl.save({filename, data: json}); toast("Backup saved."); }
      catch(err){ toast(err && err.code === "declined" ? "Backup cancelled." : "Couldn't save a file here — copy it out of Import/Export instead."); }
      return;
    }
    const url = URL.createObjectURL(new Blob([json], {type:"application/json"}));
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    toast("Backup downloaded.");
  },
  "import": () => {
    $("#overlay").innerHTML = `
    <div class="session" role="dialog" aria-label="Restore a backup">
      <div class="s-top">
        <button class="iconbtn" data-act="close-modal" aria-label="Close">✕</button>
        <div class="s-count" style="margin-left:auto">Restore a backup</div>
      </div>
      <div class="s-body"><div class="s-inner">
        <div class="card pad stack">
          <p class="small muted">Pick the backup file, or paste the contents of one. This replaces everything
          currently in the app, so export first if you have work you want to keep.</p>
          <input type="file" id="impFile" accept="application/json,.json">
          <label class="field">or paste the JSON
            <textarea id="impText" rows="7" placeholder='{"version":1,"subjects":[…' spellcheck="false"></textarea></label>
          <button class="btn primary" data-act="import-paste">Restore</button>
        </div>
      </div></div>
    </div>`;
    document.body.style.overflow = "hidden";
    const f = $("#impFile");
    if (f) f.addEventListener("change", () => {
      const file = f.files && f.files[0]; if (!file) return;
      const r = new FileReader();
      r.onload = () => { $("#impText").value = r.result; toast("File read — press Restore."); };
      r.readAsText(file);
    });
  },
  "import-paste": () => {
    try {
      const data = JSON.parse($("#impText").value);
      if (!data.cards || !data.subjects) throw new Error("bad file");
      S = migrate(data); Store.pushAll(S); Store.writeLocal(S);
      document.body.style.overflow = ""; $("#overlay").innerHTML = "";
      toast("Backup restored."); render();
    } catch(e){ toast("That didn't look like a backup file."); }
  },
  "close-modal": () => { document.body.style.overflow = ""; $("#overlay").innerHTML = ""; },
  "reset": () => {
    if (!confirm("Delete every card, result and streak, and start again?")) return;
    S = freshState(); Store.pushAll(S); Store.writeLocal(S);
    toast("Reset."); render();
  }
};

/* change handlers for the selects/inputs that live inside views */
function wireView(){
  const on = (sel, ev, fn) => { const el = $(sel); if (el) el.addEventListener(ev, fn); };
  if ($("#genPanel")) renderGen();
  on("#cdSubject","change", e => { viewCards.sel.subjectId = e.target.value; render(); });
  on("#cdTerm","change", e => { viewCards.sel.termId = e.target.value; render(); });
  on("#stTime","change", e => { S.settings.reminderTime = e.target.value; save("meta"); toast("Reminder time saved."); });
  on("#stGoal","change", e => { S.settings.dailyGoal = clamp(Number(e.target.value)||25, 5, 200); save("meta"); });

  document.querySelectorAll("input[data-term]").forEach(inp => {
    inp.addEventListener("change", e => {
      const t = termOf(e.target.dataset.term); if (!t) return;
      t[e.target.dataset.kind] = e.target.value;
      save("meta"); renderTopbar();
      toast("Test date saved.");
    });
  });

  /* Keep the topic list in step with the subject and half-term above it. */
  const rvTopics = () => {
    const sel = $("#rvTopic"); if (!sel) return;
    const cur = sel.value;
    const list = topicsFor({termId: $("#rvTerm").value, subjectId: $("#rvSubject").value || undefined});
    sel.innerHTML = `<option value="">Every topic</option>` +
      list.map(tp => `<option value="${esc(tp.key)}">${esc(tp.name)}</option>`).join("");
    if (list.some(tp => tp.key === cur)) sel.value = cur;
  };
  const upd = () => {
    const c = $("#rvCount"); if (!c) return;
    const n = customSelection().cards.length;
    c.textContent = `${n} card${n===1?"":"s"} in that selection`;
  };
  ["#rvSubject","#rvTerm"].forEach(s => on(s,"change",() => { rvTopics(); upd(); }));
  ["#rvTopic","#rvPart"].forEach(s => on(s,"change",upd));
  if ($("#rvTopic")) rvTopics();
  upd();
}

/* keyboard shortcuts during a session */
document.addEventListener("keydown", e => {
  if (!session && e.key === "Escape" && $("#overlay").innerHTML){ ACTIONS["close-modal"](); return; }
  if (!session || session.finished) return;
  const typing = e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA";
  if (typing && e.key === "Enter"){ e.preventDefault(); ACTIONS["submit-type"](); return; }
  if (typing) return;
  if (e.key === " " && !session.revealed && session.view === "flash"){ e.preventDefault(); reveal(); return; }
  if (e.key.toLowerCase() === "d" && !session.revealed){ e.preventDefault(); ACTIONS[session.test?"dunno-test":"dunno"](); return; }
  if (e.key === "Escape"){ ACTIONS["quit"](); return; }
  if (!session.revealed && session.view === "choice" && /^[1-4]$/.test(e.key)){
    const btns = document.querySelectorAll("[data-act='choose']");
    const b = btns[Number(e.key)-1]; if (b) b.click();
    return;
  }
  if (session.revealed){
    if (session.test){
      if (e.key === "Enter" && session.verdict !== null){ e.preventDefault(); ACTIONS["next-test"](); }
      return;
    }
    if (session.verdict === "no"){
      if (/^[1-4]$/.test(e.key) || e.key === "Enter" || e.key === " "){ e.preventDefault(); answer(0); }
      return;
    }
    if (/^[1-4]$/.test(e.key)) answer(Number(e.key)-1);
  }
});

/* ---------------------------------------------------------- reminders */
function nudgeCheck(){
  if (!S || !S.settings.notify || !("Notification" in window) || Notification.permission !== "granted") return;
  const now = Date.now();
  const due = dueCards().length;
  const sinceLast = now - (S.settings.lastNudge || 0);

  // 1. a batch has reached the edge of forgetting
  if (due >= 8 && sinceLast > 4*3600000){
    new Notification(`${due} cards are fading`, {
      body: "They've dropped to about 90% recall — the best moment to review them. Ten minutes does it.",
      tag: "htr-due"
    });
    S.settings.lastNudge = now; save("meta"); return;
  }
  // 2. the daily reminder
  const [h,m] = (S.settings.reminderTime||"17:30").split(":").map(Number);
  const d = new Date(); const mins = d.getHours()*60 + d.getMinutes();
  const target = h*60 + m;
  const doneToday = (S.days[todayKey()]||{}).reviewed || 0;
  if (mins >= target && mins < target + 30 && doneToday === 0 && due > 0 && sinceLast > 12*3600000){
    new Notification("Revision time", {body: `${due} cards are waiting. Keeping the streak is the whole trick.`, tag:"htr-daily"});
    S.settings.lastNudge = now; save("meta");
  }
}

/* ------------------------------------------------------------- theme */
function applyTheme(){
  const t = S ? S.settings.theme : "auto";
  if (t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
}
$("#themeBtn").addEventListener("click", () => {
  const order = ["auto","light","dark"];
  S.settings.theme = order[(order.indexOf(S.settings.theme)+1) % 3];
  applyTheme(); save("meta");
  toast(`Theme: ${S.settings.theme}`);
});
$("#duePill").addEventListener("click", () => {
  const due = dueCards();
  if (due.length) startSession(due, {title:"Due now"});
  else go("revise");
});

/* --------------------------------------------------------------- boot */
function migrate(data){
  const base = freshState();
  const s = {...base, ...data};
  s.settings = {...base.settings, ...(data.settings||{})};
  s.days = data.days || {};
  s.results = data.results || [];
  s.cards = (data.cards||[]).map(c => ({...newCard({subjectId:c.subjectId, termId:c.termId, q:c.q, a:c.a}), ...c}));
  return ensureSubjects(s);
}

async function boot(){
  const local = Store.readLocal();
  S = local ? migrate(local) : freshState();
  applyTheme();
  route = readRoute();
  render();
  Store.writeLocal(S);   // persist whatever migrate() just changed, not only a fresh install

  const [db] = await Promise.all([Store.connect(), AI.connect()]);
  if (db){
    const remote = await Store.pull();
    if (remote && (!local || (remote.updatedAt||0) > (local.updatedAt||0))){
      S = migrate(remote); applyTheme(); render(); Store.writeLocal(S);
    } else {
      await Store.pushAll(S);
    }
  }
  render();   // the card writer only appears once we know whether it's available

  nudgeCheck();
  setInterval(() => { if (!session){ renderTopbar(); nudgeCheck(); } }, 60000);
}
boot();
</script>
